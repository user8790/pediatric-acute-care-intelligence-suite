[project]
name = "pediatric-acute-care-intelligence-suite"
version = "0.1.0"
description = "Synthetic pediatric acute care operations intelligence prototype."
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

